[mod]
id = "motion_blur"
version = "1.0.0"
priority = 100

# The commit it was tested on. It uses only native hook points (hooks 58: the render hooks),
# so the launcher builds it on any Horizon that has them.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The blur itself, in the renderer crate (the render hooks can't see the game's modules).
[[module]]
id = "runtime"
file = "crates/horizon-client-render/src/lib.rs"
name = "native_motion_blur"
source = "runtime.rs"
visibility = "pub"

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "elapsed", ty = "std::time::Duration", value = "elapsed" },
]

[[injection]]
id = "needs"
kind = "HEAD"
target = "horizon_client_render::gfx::native_render::native_render_needs"
helper = "needs.rs"
bindings = [
  { name = "needs", ty = "&mut crate::gfx::native_render::RenderNeeds", value = "&mut *needs" },
]

[[injection]]
id = "world_drawn"
kind = "HEAD"
target = "horizon_client_render::gfx::native_render::native_world_drawn"
helper = "world_drawn.rs"
bindings = [
  { name = "world", ty = "&mut crate::gfx::native_render::WorldDrawn<'_>", value = "&mut *world" },
]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
